[project]
name = "artic-search"
version = "0.1.0"
description = "A CLI tool to search Art Institute of Chicago artworks by artist"
readme = "README.md"
authors = [
    { name = "Mohammed El Hamraoui", email = "92893757+MohammedElHamraoui@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = ["requests>=2.31.0"]

[project.scripts]
# Fixed: Points to main.py, not __init__.py
artic-search = "artic_search.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.ruff]
# Target the Python version you are actually using
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# The "Sweet Spot": Catches bugs, enforces modern Python, and keeps code clean
# without the noise of unused framework rules.
select = [
    "F",   # Pyflakes
    "E",   # Pycodestyle errors
    "W",   # Pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "S",   # flake8-bandit
    "RUF", # Ruff-specific rules
    "ANN", # 🌟 NEW: Enforce type annotations
]

ignore = [
    "E501",   # Line too long
    "S311",   # Pseudo-random generators
    "COM812", # Missing trailing comma
    "ISC001", # Implicit string concatenation
    "ANN401", # Dynamically typed expressions (Any) - optional: ignore this if you use 'Any' often
]

[tool.ruff.lint.per-file-ignores]
# This is the BEST part of Corey's config! 
# Tests have different rules than production code.
"test_*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "ANN"]
"*_test.py" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "ANN"]
"conftest.py" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "ANN"]
